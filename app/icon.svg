<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- RB mark. Near-black (the site bg) on light browser chrome, off-white (the site fg) on dark. The shape is the
       alpha of the original icon, used as a mask so one fill color draws it. -->
  <style>
    .mark { fill: #0e0c11; }
    @media (prefers-color-scheme: dark) { .mark { fill: #ece4e3; } }
  </style>
  <mask id="rb" style="mask-type: alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
    <image width="512" height="512" href="data:image/png;base64,"/>
  </mask>
  <rect class="mark" width="512" height="512" mask="url(#rb)"/>
</svg>
